<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose Payment Group</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #f5f5f5;
        color: #222;
      }

      h1 {
        margin-bottom: 10px;
      }

      p {
        margin-bottom: 25px;
        color: #555;
      }

      .group-button {
        width: 220px;
        padding: 16px;
        margin: 8px;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        color: white;
      }

      .bit {
        background: #1687f8;
      }

      .paybox {
        background: #19a56b;
      }

      .group-button:hover {
        filter: brightness(0.9);
      }

      #status {
        margin-top: 20px;
      }
    </style>
  </head>

  <body>
    <h1>Select a group</h1>
    <p>Please choose your payment group.</p>

    <button class="group-button bit" onclick="selectGroup('BIT')">BIT</button>

    <button class="group-button paybox" onclick="selectGroup('PAYBOX')">
      PAYBOX
    </button>

    <p id="status" role="status"></p>

    <script>
      // Configuration
      const LIMIT = 25;
      const bitGroupName = "BIT";
      const payboxGroupName = "PAYBOX";

      // Link definitions
      const bitLinks = [
        {
          name: "Reut",
          url: "https://www.bitpay.co.il/app/me/50BA2B18-2080-9664-37A6-2CFCF634082A4C66",
          received: 13,
        },
        {
          name: "Itamar",
          url: "https://www.bitpay.co.il/app/me/3FBF24A4-A1C9-73E3-204B-EC98697C0037B7A2",
          received: 6,
        },
        {
          name: "Itamar's mom",
          url: "https://www.bitpay.co.il/app/me/DE0AE499-A7B7-3236-C318-3BC0A7208F547B29",
          received: 1,
        },
        {
          name: "Itamar's dad",
          url: "https://www.bitpay.co.il/app/me/688C12C5-A56F-B0EC-D50F-CF3DF91C073A5F02",
          received: 0,
        },
        {
          name: "Reut's mom",
          url: "https://www.bitpay.co.il/app/me/A8376944-D30F-6DA9-26EB-B77058EBA0DF474D",
          received: 12,
        },
        {
          name: "Reut's dad",
          url: "https://www.bitpay.co.il/app/me/56953216-4B63-8807-4F7A-02E0FAD84F9F4ED4",
          received: 19,
        },
      ];

      const payboxLinks = ["https://links.payboxapp.com/XnOyaL5Ih7b"];

      // Calculate a link's weight from its remaining target.
      const calculateWeight = (link) => {
        const remaining = Math.max(0, LIMIT - link.received);

        return remaining * multiplier;
      };

      // Keep only links that can still receive payments.
      const getEligibleLinks = (links) =>
        links
          .map((link) => ({
            ...link,
            weight: calculateWeight(link),
          }))
          .filter((link) => link.weight > 0);

      // Choose one link according to its relative weight.
      const chooseWeightedLink = (links) => {
        const totalWeight = links.reduce(
          (total, link) => total + link.weight,
          0,
        );

        if (totalWeight <= 0) {
          return null;
        }

        let random = Math.random() * totalWeight;

        for (const link of links) {
          random -= link.weight;

          if (random < 0) {
            return link;
          }
        }

        return null;
      };

      // Return the links belonging to the requested group.
      const getGroupLinks = (groupName) => {
        if (groupName === bitGroupName) {
          return getEligibleLinks(bitLinks);
        }

        if (groupName === payboxGroupName) {
          return payboxLinks.map((url) => ({
            url,
            weight: 1,
          }));
        }

        return null;
      };

      // Select a destination and redirect to it.
      const selectGroup = (groupName) => {
        const links = getGroupLinks(groupName);

        if (links === null) {
          return;
        }

        if (links.length === 0) {
          document.getElementById("status").textContent =
            "No eligible links are configured for " + groupName + ".";
          return;
        }

        const selectedLink = chooseWeightedLink(links);

        if (selectedLink === null) {
          document.getElementById("status").textContent =
            "Unable to select a link for " + groupName + ".";
          return;
        }

        window.location.replace(selectedLink.url);
      };

      // Read the requested group from the URL.
      const params = new URLSearchParams(window.location.search);
      const group = params.get("group");

      // Start the redirect only for a valid group.
      if (group === bitGroupName || group === payboxGroupName) {
        selectGroup(group);
      }
    </script>
  </body>
</html>
